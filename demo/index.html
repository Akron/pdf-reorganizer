<!DOCTYPE html>
<html>
  <head>
    <style>
:root {
  font-family: tahoma, verdana, arial;
}

pdf-reorganizer {
--pdfro-viewport-bg-color: #bbb;
}

body {
  background-color: #f5f5f5;
  margin: 0;
  padding: 20px;
}

.demo-container {
  border: 2px dashed #3b82f6;
  margin: 20px 0;
  padding: 0;
  background-color: #f8fafc;
  border-radius: 6px;
  position: relative;
  overflow: hidden;
  width: 640px;
  height: 380px;
}


    </style>

    <script type="module">
      import '/pdf-reorganizer.js';
    </script>
  </head>

  <body>
    <h1>PDF Reorganizer Demo</h1>
    
    <pdf-reorganizer url="example.pdf"></pdf-reorganizer>

    <div class="demo-container">
      <pdf-reorganizer url="example.pdf" fit></pdf-reorganizer>
    </div>
  </body>

  <script>
   const reorgs = document.getElementsByTagName("pdf-reorganizer");
   for (let i = 0; i < reorgs.length; i++) {
     reorgs[i].addEventListener('processed', function (ev) {
       window.alert(JSON.stringify(ev.detail));
     });
   }
 </script>

</html>
