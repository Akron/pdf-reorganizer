<!DOCTYPE html>
<html>
  <head>
    <style>
:root {
  font-family: tahoma, verdana, arial;
}

pdf-reorganizer {
--pdfro-viewport-bg-color: #bbb;
}

body {
  background-color: #f5f5f5;
  margin: 0;
  padding: 20px;
}

.demo-container {
  border: 2px dashed #3b82f6;
  margin: 20px 0;
  padding: 0;
  background-color: #f8fafc;
  border-radius: 6px;
  position: relative;
  overflow: hidden;
  width: 640px;
  height: 380px;
}

.demo-container.flex {
  align-items: stretch;
  display: flex;
}

.demo-container.flex .button-group {
  list-style: none;
  padding: .5em;
  text-wrap: nowrap;
}

.demo-container.flex .button-group > li {
  cursor: pointer;
  margin: .5em;
  border: 1px solid #3b82f6;
  border-radius: 5px;
  padding: 5px;
}

.demo-container.flex .button-group > li:hover {
  background-color: #bbb;
}

.button-group > li.active {
  background-color: #3b82f6;
}

.button-group > li::after {
  position: absolute;
  font-size: 8pt;
  background-color: #3b82f6;
  color: white;
  border: 1px solid white;
  border-radius: 8pt;
  padding: 0 3pt;
  margin-top: -6pt;
  content: attr(data-count);
  cursor: default;
  pointer-events: none;
}

.button-group > li:where([data-count="0"],[data-count="1"])::after {
  content: none;
}

#ribbon {
  position: absolute;
  top: 0;
  right: 0;
  border: 0;
}

    </style>

    <script type="module">
      import '../pdf-reorganizer.js';
    </script>
  </head>

  <body>

    <a id="ribbon" href="https://github.com/Akron/pdf-reorganizer"><img loading="lazy" decoding="async" width="149" height="149" src="https://github.blog/wp-content/uploads/2008/12/forkme_right_darkblue_121621.png" class="attachment-full size-full" alt="Fork me on GitHub"></a>

    <h1>PDF Reorganizer Demo</h1>
    
    <pdf-reorganizer url="example.pdf"></pdf-reorganizer>

    <div class="demo-container">
      <pdf-reorganizer url="example.pdf" fit></pdf-reorganizer>
    </div>

    <div class="demo-container flex">
      <ul class="button-group">
        <li id="pdfro-split-before">Split before</li>
        <li id="pdfro-rotate-left">Rotate left</li>
        <li id="pdfro-rotate-right">Rotate right</li>
        <li id="pdfro-select">Select</li>
        <li id="pdfro-select-all">Select All</li>
        <li id="pdfro-remove">Remove</li>
        <li id="pdfro-magnify">Magnify</li>
        <li id="pdfro-process">Run</li>
      </ul>
      <div>
        <pdf-reorganizer url="example.pdf"
                         split-before-button="pdfro-split-before"
                         rotate-left-button="pdfro-rotate-left"
                         rotate-right-button="pdfro-rotate-right"
                         select-button="pdfro-select"
                         select-all-button="pdfro-select-all"
                         comment-button=""
                         remove-button="pdfro-remove"
                         magnify-button="pdfro-magnify"
                         process-button="pdfro-process"
                         fit></pdf-reorganizer>
      </div>
    </div>
  </body>

  
  <script>
   const reorgs = document.getElementsByTagName("pdf-reorganizer");
   for (let i = 0; i < reorgs.length; i++) {
     reorgs[i].addEventListener('processed', function (ev) {
       window.alert(JSON.stringify(ev.detail));
     });
   }
 </script>

</html>
